name: Daily Accuracy Check

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas

      - name: Run accuracy check
        run: python scripts/auto_check.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 如果 accuracy.json 唔存在，建立一個空嘅
          if [ ! -f accuracy.json ]; then
            echo '{}' > accuracy.json
          fi
          git add accuracy.json
          # 只有當有變更時先 commit
          git diff --staged --quiet || git commit -m "🤖 自動更新準確度數據 [skip ci]"
          git push
