name: Update Odds History

on:
  schedule:
    # 星期三 (跑馬地夜馬 HV)：香港時間 18:00 - 23:00 (每 30 分鐘)
    # UTC 時間 = 10:00 - 15:00
    - cron: '0,30 10-15 * * 3'
    
    # 星期六、日 (沙田日馬 ST)：香港時間 12:00 - 18:00 (每 30 分鐘)
    # UTC 時間 = 4:00 - 10:00
    - cron: '0,30 4-10 * * 6,0'
    
  workflow_dispatch: # 允許手動觸發

jobs:
  fetch_odds:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝依賴
        run: |
          pip install selenium beautifulsoup4 pandas

      - name: 執行賠率爬蟲（自動判斷 ST / HV）
        run: |
          DAY=$(date +%u) # 1=Mon, 3=Wed, 6=Sat, 7=Sun
          if [ "$DAY" -eq 3 ]; then
            COURSE="HV" # 星期三跑馬地夜馬
          else
            COURSE="ST" # 星期六日沙田日馬
          fi
          echo "今日係星期 $DAY，馬場設定為 $COURSE"
          python fetch_odds.py $(date +'%Y-%m-%d') $COURSE

      - name: 提交並推送賠率數據
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add odds_history.csv
          git commit -m "Auto update odds history [skip ci]" || echo "No changes to commit"
          git push
