name: Update Odds History

on:
  schedule:
    # 星期二 15:30（香港时间）
    - cron: '30 7 * * 2'
    # 星期六 14:00（香港时间）
    - cron: '0 6 * * 6'
    # 星期三 17:30 - 23:00（香港时间）
    - cron: '30,35,40,45,50,55 9 * * 3'
    - cron: '*/5 10-14 * * 3'
    - cron: '0 15 * * 3'
    # 星期日 11:30 - 18:00（香港时间）
    - cron: '30,35,40,45,50,55 3 * * 0'
    - cron: '*/5 4-9 * * 0'
    - cron: '0 10 * * 0'
  workflow_dispatch:

jobs:
  fetch-odds:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 安裝依賴 (改用 Chromium 徹底解決版本衝突)
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver
          pip install selenium beautifulsoup4 pandas

      - name: 執行賠率爬蟲
        run: python scrape_odds.py

      - name: 提交變更
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add odds_history.csv
          git commit -m "Update odds $(date +'%Y-%m-%d %H:%M') [skip ci]" || echo "No changes to commit"
          git push
