name: 補齊賽果 horse_id

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝依賴
        run: pip install pandas

      - name: 執行補齊
        run: python fix_race_results.py

      - name: 提交變更
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add race_results_clean.csv
          git commit -m "Fix horse_id in race results [skip ci]" || echo "No changes"
          git push
