name: 自動更新賽果

on:
  schedule:
    # 逢星期日、一、四 早上 8:00 (香港時間)
    - cron: '0 0 * * 0,1,4'
  workflow_dispatch:
    inputs:
      target_date:
        description: '請輸入要爬取嘅日期 (格式: YYYY-MM-DD，留空則由腳本自動決定)'
        required: false
        default: ''

jobs:
  update-results:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝 Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: 安裝依賴
        run: |
          pip install pandas selenium webdriver-manager

      - name: 執行賽果爬蟲
        env:
          INPUT_TARGET_DATE: ${{ github.event.inputs.target_date }}
        run: python scrape_results.py

      - name: 提交變更
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add race_results_clean.csv
          git commit -m "Auto update race results [skip ci]" || echo "No changes to commit"
          git push
