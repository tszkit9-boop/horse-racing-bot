name: 自動更新賽果

on:
  schedule:
    # 逢星期日、一、四 早上 8:00 (香港時間)
    - cron: '0 0 * * 0,1,4'
  workflow_dispatch: # 允許手動觸發

jobs:
  update-results:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 👈 必須要有呢句，先有權限 push

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝 Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: 安裝依賴
        run: |
          pip install pandas selenium webdriver-manager

      - name: 執行賽果爬蟲
        run: python scrape_results.py

      - name: 提交變更
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add race_results_clean.csv
          git commit -m "Auto update race results [skip ci]" || echo "No changes to commit"
          git push # 👈 呢句最重要，將更新推返 GitHub
