# 如果 URL 帶有 ?raw=true 參數，直接輸出 users.json 並結束
if st.query_params.get("raw") == "true":
    if os.path.exists(USER_DATA_FILE):
        with open(USER_DATA_FILE, 'r', encoding='utf-8') as f:
            data = json.load(f)
        st.json(data)
    else:
        st.error("users.json 不存在")
    st.stop()
