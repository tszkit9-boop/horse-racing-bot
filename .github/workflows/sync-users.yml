name: 自動同步 users.json

on:
  push:
    branches:
      - main
    paths:
      - 'app_streamlit.py'   # 當 app_streamlit.py 有變更時觸發
  schedule:
    - cron: '*/5 * * * *'   # 保留每 5 分鐘一次作為後備
  workflow_dispatch:        # 手動觸發

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出 repository
        uses: actions/checkout@v4

      - name: 下載最新 users.json
        run: |
          curl -o users.json https://horse-racing-bot-picmquaqteh5dsgjpgn4du.streamlit.app/?raw=true || echo "下載失敗"

      - name: 提交變更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add users.json
          git diff --staged --quiet || git commit -m "自動同步 users.json $(date '+%Y-%m-%d %H:%M:%S')"
          git push
