name: Retrain Models

on:
  schedule:
    - cron: '0 0 * * 0' # 每星期日 08:00 (香港時間 UTC+8)
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 👈 必須加呢句，先有權限 Push

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝依賴
        run: |
          pip install pandas numpy xgboost catboost scikit-learn

      - name: 執行訓練
        run: python train_models.py

      - name: 提交並推送模型檔案
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add hk_racing_model.pkl hk_catboost_model.cbm hk_ranking_model.pkl model_info.json
          git commit -m "Auto retrain models [skip ci]" || echo "No changes to commit"
          git push
