name: 自動更新排位表

on:
  schedule:
    # 香港時間 06:00 = UTC 22:00 (前一日)
    # 逢星期二、五、六（香港賽馬日）
    - cron: '0 22 * * 1,4,5'   # 對應 UTC 22:00 = 香港 06:00 (翌日)
  workflow_dispatch:

jobs:
  update-racecard:
    runs-on: ubuntu-latest
    
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝依賴
        run: |
          pip install --upgrade pip
          pip install requests pandas beautifulsoup4 lxml

      - name: 執行爬蟲（自動偵測賽馬日）
        run: |
          echo "🕒 開始執行爬蟲 - $(date)"
          python scrape_racecard_with_odds.py --auto --weekdays 2,5,6
          echo "✅ 爬蟲執行完成"

      - name: 檢查檔案變更
        id: check_changes
        run: |
          if git status --porcelain | grep -q "HKCJ_FULL_YEAR_DATA.csv"; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: 提交變更
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add HKCJ_FULL_YEAR_DATA.csv
          git commit -m "自動更新排位表 $(date +'%Y-%m-%d %H:%M')"
          git push
          echo "✅ 已成功提交變更"
